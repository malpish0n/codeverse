name: Build and test desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        shell: bash
        run: ./gradlew --no-daemon test :desktop-ui:installDist :desktop-ui:distZip
      - name: Package self-contained application
        run: python scripts/package.py --type app-image --dest dist
      - name: Upload application and test reports
        uses: actions/upload-artifact@v4
        with:
          name: CODEVERSE-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/
            desktop-ui/build/distributions/*.zip
            **/build/reports/tests/
      - name: Package native installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            python scripts/package.py --type dmg --dest installers
          else
            python scripts/package.py --type deb --dest installers
          fi
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: CODEVERSE-installer-${{ runner.os }}
          path: installers/
