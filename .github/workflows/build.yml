name: Build and test desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Build and test
        shell: bash
        run: ./gradlew --no-daemon test :desktop-ui:installDist :desktop-ui:distZip
      - name: Package self-contained application
        run: python scripts/package.py --type app-image --dest dist
      - name: Upload application and test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CODEVERSE-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/
            desktop-ui/build/distributions/*.zip
            **/build/reports/tests/
      - name: Package native installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            python scripts/package.py --type dmg --dest installers
          else
            python scripts/package.py --type deb --dest installers
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os != 'Windows'
        with:
          name: CODEVERSE-installer-${{ runner.os }}
          path: installers/
